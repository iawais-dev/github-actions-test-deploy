name: Deploy nodejs app to server 

on:
  push:
     branches:
           - master


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
 
      - name: deploy via SSH
        uses: appleboy/ssh-actions@v1.0.3
        with: 
          host: example-ip
          username: root
          key: example-ssh
          script: |
            cd /home/Desktop/Code/githubaction/github-action-test
            git pull 
            docker compose up -d --build



           